name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Unit · Build · Egress audit · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (strict, noEmit)
        run: npm run typecheck

      - name: ESLint (includes network-API bans)
        run: npm run lint

      - name: Vitest unit + integration suites
        run: npm run test:unit

      - name: Production build (PWA + CSP)
        run: npm run build

      - name: Zero-egress static audit (source + bundle)
        run: npm run audit:egress

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (boot, stochastic touch, sunset, egress, PDF, offline)
        run: npx playwright test
        env:
          MONTE_CARLO_RUNS: 100

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
