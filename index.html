<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; base-uri 'self'; object-src 'none'; form-action 'none';"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1A1A24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Bramble & Pip is a calm, offline, ad-free nature adventure for children aged 3 to 6. Explore the Whispering Woods with Pip for fifteen peaceful minutes a day."
    />
    <title>Bramble &amp; Pip — a quiet woodland adventure</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <h1 class="visually-hidden">Bramble &amp; Pip</h1>
    <main id="app">
      <div id="game-container" aria-label="Bramble and Pip game" role="application"></div>
      <noscript>Bramble &amp; Pip needs JavaScript to run. It never connects to the internet.</noscript>
    </main>
    <div id="overlay-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
